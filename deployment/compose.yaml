name: registry-openfn-pilot-045

services:
  volume-init:
    image: node:24.19.0-bookworm@sha256:4196d66a565c6f195728d9952f161f4adfe2ad753052a08b7ec7f1c5a6bda42b
    platform: linux/amd64
    user: root
    environment:
      PILOT_UID: ${PILOT_UID:-1000}
      PILOT_GID: ${PILOT_GID:-1000}
    command: [sh, -ec, 'find /breg-audit /casework-audit /evidence-audit /evidence-transit /openbao-data /destination-data /worker-cache \( ! -uid "$$PILOT_UID" -o ! -gid "$$PILOT_GID" \) -exec chown "$$PILOT_UID:$$PILOT_GID" {} +; find /breg-audit /casework-audit /evidence-audit /evidence-transit /openbao-data /destination-data /worker-cache -maxdepth 0 ! -perm 0700 -exec chmod 0700 {} +']
    volumes:
      - {type: volume, source: breg-audit, target: /breg-audit, volume: {nocopy: true}}
      - {type: volume, source: casework-audit, target: /casework-audit, volume: {nocopy: true}}
      - {type: volume, source: evidence-audit, target: /evidence-audit, volume: {nocopy: true}}
      - {type: volume, source: evidence-transit, target: /evidence-transit, volume: {nocopy: true}}
      - {type: volume, source: openbao-data, target: /openbao-data, volume: {nocopy: true}}
      - {type: volume, source: destination-data, target: /destination-data, volume: {nocopy: true}}
      - {type: volume, source: worker-cache, target: /worker-cache, volume: {nocopy: true}}

  lightning-db:
    image: postgres:17.11@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    env_file: ../pilot/agriculture/.runtime-0.45/openfn/postgres.env
    volumes:
      - lightning-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  breg-db:
    image: registry-openfn-postgres:pilot-045
    platform: linux/amd64
    env_file: ../pilot/agriculture/.runtime-0.45/breg-db/postgres.env
    volumes:
      - breg-db:/var/lib/postgresql/data
      - ../pilot/agriculture/.runtime-0.45/breg-db:/config/postgres:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  casework-db:
    image: registry-openfn-postgres:pilot-045
    platform: linux/amd64
    env_file: ../pilot/agriculture/.runtime-0.45/casework-db/postgres.env
    volumes:
      - casework-db:/var/lib/postgresql/data
      - ../pilot/agriculture/.runtime-0.45/casework-db:/config/postgres:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  lightning:
    user: "${PILOT_UID:-1000}:${PILOT_GID:-1000}"
    image: registry-openfn-lightning:pilot-045
    platform: linux/amd64
    env_file: ../pilot/agriculture/.runtime-0.45/openfn/lightning.env
    environment:
      PORT: '4000'
      URL_SCHEME: http
      URL_HOST: localhost
      URL_PORT: '4010'
      USAGE_TRACKING_ENABLED: 'false'
      LOCAL_ADAPTORS: 'true'
      OPENFN_ADAPTORS_REPO: /opt/registry-adaptors
    volumes:
      - ../pilot/lightning:/opt/pilot/lightning:ro
      - ../pilot/agriculture/.runtime-0.45/openfn/secrets:/run/pilot-secrets
    ports: ['127.0.0.1:4010:4000']
    depends_on:
      lightning-db: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:4000/health_check]
      interval: 5s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  issuer:
    user: "${PILOT_UID:-1000}:${PILOT_GID:-1000}"
    image: ghcr.io/thunder-id/thunderid:1.0.1@sha256:d3c0613ff447a551fd440768a15bdfb6668948e80809cbb50f82d6752f22ab3e
    platform: linux/amd64
    working_dir: /opt/thunderid
    command: [./start.sh]
    volumes:
      - ../pilot/agriculture/.runtime-0.45/issuer/database:/opt/thunderid/database
      - ../pilot/agriculture/.runtime-0.45/issuer/certs:/opt/thunderid/config/certs
      - ../pilot/agriculture/.runtime-0.45/issuer/secrets:/opt/thunderid/config/secrets
      - ../pilot/agriculture/.runtime-0.45/issuer/deployment.yaml:/opt/thunderid/deployment.yaml:ro
      - ../pilot/agriculture/.runtime-0.45/issuer/resources:/opt/thunderid/config/resources:ro
    ports:
      - '127.0.0.1:4011:8097'
      - '127.0.0.1:4012:8095'
      - '127.0.0.1:4013:8096'
    restart: unless-stopped

  tls-gateway:
    user: "${PILOT_UID:-1000}:${PILOT_GID:-1000}"
    image: nginx:1.30.5-alpine3.24@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    platform: linux/amd64
    network_mode: service:issuer
    command: [nginx, -g, 'daemon off;', -c, /etc/nginx/nginx.conf]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../pilot/agriculture/.runtime-0.45/tls/server.crt:/etc/pilot-tls/server.crt:ro
      - ../pilot/agriculture/.runtime-0.45/tls/server.key:/etc/pilot-tls/server.key:ro
    depends_on:
      issuer: {condition: service_started}
    restart: unless-stopped

  openbao:
    user: "${PILOT_UID:-1000}:${PILOT_GID:-1000}"
    image: ghcr.io/openbao/openbao:2.7.0@sha256:71156a1c6623a5fa3f5e61b0c6a8ead0faf0df29a778339188443551995d1315
    platform: linux/amd64
    network_mode: service:issuer
    command: [server]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      SKIP_CHOWN: 'true'
    volumes:
      - type: volume
        source: openbao-data
        target: /openbao/file
        volume:
          nocopy: true
      - ./openbao/server.hcl:/openbao/config/server.hcl:ro
      - ./openbao/evidence-signing.hcl:/openbao/policy/evidence-signing.hcl:ro
      - ./openbao/bootstrap.sh:/openbao/bootstrap.sh:ro
      - ../pilot/agriculture/.runtime-0.45/openbao:/run/openbao-secrets
    depends_on:
      issuer: {condition: service_started}
      volume-init: {condition: service_completed_successfully}
    restart: unless-stopped

  evidence-transit:
    user: "${PILOT_UID:-1000}:${PILOT_GID:-1000}"
    image: ghcr.io/openbao/openbao:2.7.0@sha256:71156a1c6623a5fa3f5e61b0c6a8ead0faf0df29a778339188443551995d1315
    platform: linux/amd64
    network_mode: service:issuer
    command: [agent, -config=/openbao/config/evidence-agent.hcl]
    environment:
      SKIP_CHOWN: 'true'
    volumes:
      - ./openbao/evidence-agent.hcl:/openbao/config/evidence-agent.hcl:ro
      - ../pilot/agriculture/.runtime-0.45/openbao/role-id:/run/openbao-credentials/role-id:ro
      - ../pilot/agriculture/.runtime-0.45/openbao/secret-id:/run/openbao-credentials/secret-id:ro
      - {type: volume, source: evidence-transit, target: /run/registry-evidence, volume: {nocopy: true}}
    depends_on:
      openbao: {condition: service_started}
      volume-init: {condition: service_completed_successfully}
    restart: unless-stopped

  breg:
    user: "${PILOT_UID:-1000}:${PILOT_GID:-1000}"
    image: ghcr.io/registrystack/breg:v0.45.0@sha256:4e039b26800952c20926a1cdc1b138232c564ed2ec8f73f7b23c3234140fd7d9
    platform: linux/amd64
    network_mode: service:issuer
    command: [--runtime-config, /config/breg/runtime.yaml]
    environment:
      SSL_CERT_FILE: /config/breg/secrets/trust-bundle.pem
    volumes:
      - ../pilot/agriculture/.runtime-0.45/breg:/config/breg:ro
      - {type: volume, source: breg-audit, target: /var/lib/registry-breg, volume: {nocopy: true}}
    depends_on:
      issuer: {condition: service_started}
      breg-db: {condition: service_healthy}
    restart: unless-stopped

  casework:
    user: "${PILOT_UID:-1000}:${PILOT_GID:-1000}"
    image: ghcr.io/registrystack/casework:v0.45.0@sha256:d0446630798f4f53f291f10f5018eb00cd8883e4383ebb7f9b897a1405eee72d
    platform: linux/amd64
    network_mode: service:issuer
    command: [--runtime-config, /config/casework/runtime.yaml, serve]
    environment:
      SSL_CERT_FILE: /config/casework/secrets/pilot-ca.pem
    volumes:
      - ../pilot/agriculture/.runtime-0.45/casework:/config/casework:ro
      - {type: volume, source: casework-audit, target: /var/lib/registry-casework, volume: {nocopy: true}}
    depends_on:
      issuer: {condition: service_started}
      casework-db: {condition: service_healthy}
    restart: unless-stopped

  evidence:
    user: "${PILOT_UID:-1000}:${PILOT_GID:-1000}"
    image: ghcr.io/registrystack/evidence:v0.45.0@sha256:8b9229af2308f70d3cbdc8ac8131fc670b929bb3db174c153719de21135447ab
    platform: linux/amd64
    network_mode: service:issuer
    command: [serve, --runtime-config, /config/evidence/runtime.yaml]
    environment:
      SSL_CERT_FILE: /config/evidence/tls/pilot-ca.pem
    volumes:
      - ../pilot/agriculture/.runtime-0.45/evidence:/config/evidence:ro
      - ../pilot/agriculture/.runtime-0.45/tls/ca.pem:/config/evidence/tls/pilot-ca.pem:ro
      - {type: volume, source: evidence-audit, target: /var/lib/registry-evidence, volume: {nocopy: true}}
      - {type: volume, source: evidence-transit, target: /run/registry-evidence, volume: {nocopy: true}}
    depends_on:
      issuer: {condition: service_started}
      breg: {condition: service_started}
      evidence-transit: {condition: service_started}
      tls-gateway: {condition: service_started}
    restart: unless-stopped

  worker:
    user: "${PILOT_UID:-1000}:${PILOT_GID:-1000}"
    image: registry-openfn-worker:pilot-045
    platform: linux/amd64
    network_mode: service:issuer
    env_file: ../pilot/agriculture/.runtime-0.45/openfn/worker.env
    environment:
      OPENFN_ADAPTORS_REPO: /opt/registry-adaptors
      SSL_CERT_FILE: /config/evidence-client/pilot-ca.pem
      WORKER_LIGHTNING_SERVICE_URL: ws://lightning:4000/worker
      WORKER_STATE_PROPS_TO_REMOVE: configuration
      WORKER_REPO_DIR: /var/cache/openfn/repo
      WORKER_SENTRY_DSN: ''
      SENTRY_DSN: ''
    volumes:
      - ../pilot/agriculture/.runtime-0.45/evidence-client:/config/evidence-client:ro
      - ../pilot/agriculture/.runtime-0.45/tls/ca.pem:/config/evidence-client/pilot-ca.pem:ro
      - ../pilot/agriculture/.runtime-0.45/tls/ca.pem:/etc/ssl/certs/ca-certificates.crt:ro
      - {type: volume, source: worker-cache, target: /var/cache/openfn, volume: {nocopy: true}}
    depends_on:
      issuer: {condition: service_started}
      lightning: {condition: service_healthy}
    restart: unless-stopped

  bridge:
    user: "${PILOT_UID:-1000}:${PILOT_GID:-1000}"
    image: registry-openfn-services:pilot-045
    platform: linux/amd64
    network_mode: service:issuer
    command: [node, services/event-bridge/src/server.js]
    env_file: ../pilot/agriculture/.runtime-0.45/openfn/bridge.env
    environment:
      BREG_BIND_HOST: '127.0.0.1'
      BREG_EVENT_BODY_FORMAT: hook-envelope-v1
      PORT: '8081'
      ALLOW_HTTP: 'true'
      BREG_HMAC_KEY_FILE: /config/bridge/breg-hmac-key
      BREG_EXPECTED_EVENTS_FILE: /config/bridge/expected-events.json
      BREG_EXPECTED_ENTITY: farm
      BREG_ALLOWED_VALUE_FIELDS_FILE: /config/bridge/allowed-value-fields.json
      OPENFN_API_KEY_FILE: /config/bridge/openfn-api-key
      MAX_BODY_BYTES: '65536'
      MAX_DELIVERY_SKEW_SECONDS: '300'
      OPENFN_TIMEOUT_MS: '3000'
    volumes:
      - ../pilot/agriculture/.runtime-0.45/bridge:/config/bridge:ro
    depends_on:
      issuer: {condition: service_started}
      lightning: {condition: service_healthy}
    restart: unless-stopped

  destination:
    user: "${PILOT_UID:-1000}:${PILOT_GID:-1000}"
    image: registry-openfn-services:pilot-045
    platform: linux/amd64
    command: [node, services/destination/src/server.js]
    environment:
      PORT: '8082'
      DESTINATION_API_KEY_FILE: /config/destination/api-key
      DESTINATION_DB_PATH: /data/destination.sqlite
    volumes:
      - ../pilot/agriculture/.runtime-0.45/destination:/config/destination:ro
      - {type: volume, source: destination-data, target: /data, volume: {nocopy: true}}
    depends_on:
      volume-init: {condition: service_completed_successfully}
    restart: unless-stopped

  tools:
    user: "${PILOT_UID:-1000}:${PILOT_GID:-1000}"
    image: registry-openfn-tools:pilot-045
    platform: linux/amd64
    network_mode: service:issuer
    profiles: [tools]
    working_dir: /workspace
    environment:
      SSL_CERT_FILE: /config/breg/secrets/trust-bundle.pem
      PILOT_RUNTIME_ROOT: /workspace/pilot/agriculture/.runtime-0.45
    volumes:
      - ..:/workspace:ro
      - ../pilot/agriculture:/opt/pilot/agriculture:ro
      - ../pilot/agriculture/.runtime-0.45:/workspace/pilot/agriculture/.runtime-0.45
      - ../pilot/agriculture/.runtime-0.45/breg:/config/breg
      - ../pilot/agriculture/.runtime-0.45/casework:/config/casework
      - ../pilot/agriculture/.runtime-0.45/evidence:/config/evidence
      - ../pilot/agriculture/.runtime-0.45/evidence-client:/config/evidence-client
      - ../pilot/agriculture/.runtime-0.45/tls/ca.pem:/config/evidence/tls/pilot-ca.pem:ro
      - ../pilot/agriculture/.runtime-0.45/tls/ca.pem:/config/evidence-client/pilot-ca.pem:ro
      - {type: volume, source: evidence-transit, target: /run/registry-evidence, volume: {nocopy: true}}
      - {type: volume, source: breg-audit, target: /var/lib/registry-breg, volume: {nocopy: true}}
      - {type: volume, source: casework-audit, target: /var/lib/registry-casework, volume: {nocopy: true}}
      - {type: volume, source: evidence-audit, target: /var/lib/registry-evidence, volume: {nocopy: true}}
    depends_on:
      issuer: {condition: service_started}
      breg-db: {condition: service_healthy}
      casework-db: {condition: service_healthy}
    entrypoint: []
    command: [python3, --version]

  sdk-tools:
    user: "${PILOT_UID:-1000}:${PILOT_GID:-1000}"
    image: registry-openfn-worker:pilot-045
    platform: linux/amd64
    network_mode: service:issuer
    profiles: [tools]
    working_dir: /opt/registry-adaptors
    volumes:
      - ../pilot/agriculture:/opt/pilot/agriculture:ro
      - ../pilot/agriculture/.runtime-0.45/evidence-client:/config/evidence-client:ro
      - ../pilot/agriculture/.runtime-0.45/tls/ca.pem:/run/pilot-ca.pem:ro
    depends_on:
      issuer: {condition: service_started}
      evidence: {condition: service_started}
    entrypoint: []
    command: [node, /opt/pilot/agriculture/evidence-smoke.mjs]

volumes:
  lightning-db:
  breg-db:
  casework-db:
  breg-audit:
  casework-audit:
  evidence-audit:
  evidence-transit:
  openbao-data:
  worker-cache:
  destination-data:

networks:
  default:
    ipam:
      config:
        - subnet: ${PILOT_SUBNET:-10.254.45.0/24}
