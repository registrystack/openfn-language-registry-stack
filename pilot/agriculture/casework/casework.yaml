apiVersion: id.registrystack.org/formats/casework/project/v1alpha1
kind: CaseworkProject
project:
  id: agriculture-review
  version: "2"
accessProfiles:
  reviewer:
    principalClaim: registry_principal
    requiredScopes: [casework:staff]
    role: staff
  supervisor:
    principalClaim: registry_principal
    requiredScopes: [casework:supervisor]
    role: supervisor
  administrator:
    principalClaim: registry_principal
    requiredScopes: [casework:admin]
    role: administrator
  integration-requester:
    principalClaim: sub
    requiredScopes: [casework:reviews:request]
    role: requester
contextProviders:
  agricultural-holdings:
    capabilities: [human-display, service-status]
    sourceNamespace: agricultural-holdings
    deploymentRef: agricultural-holdings
    serviceProfiles:
      service-status: casework-reader
queues:
  corrections:
    label: Agricultural holding name corrections
reviewPolicies:
  name-correction:
    version: "2"
    purpose: approval
    context:
      mode: current-source
      provider: agricultural-holdings
      contract:
        id: urn:registry:breg:review-context:agricultural-holdings:correct-farm-name:farm-name-context
        revision: sha256:54ec76f0558c42b3e698f3209fb1b8f53d0c9cc4e343edf7d98bbf757c0f2d2b
        schemaDigest: sha256:0bcdce5b1d3ae5d51328c3fb79d0c86f20b384bfc3cfa5b834bc681a11e7f4f0
    stages:
      - id: review
        queue: corrections
        decidingProfiles: [reviewer]
        excludeInitiator: false
        requiredApprovals: 1
    retention:
      terminalRetentionDays: 30
      accountabilityRetentionDays: 365
    displaySchema:
      $ref: schemas/name-correction.schema.json
    outcomes:
      approved:
        label: Approve correction
        settlement: approved
        reasonRequired: false
        publicReason: optional
      rejected:
        label: Reject correction
        settlement: rejected
        reasonRequired: true
        publicReason: required
      changes-requested:
        label: Request changes
        settlement: changes-requested
        reasonRequired: true
        publicReason: required
trustedProducers:
  registry-breg:
    profile: integration-requester
    issuer: https://127.0.0.1:8443
    subject: __CASEWORK_PRODUCER_SUBJECT__
    sourceNamespaces: [agricultural-holdings]
    reviewPolicies: [name-correction]
    retention: {receiptRetentionDays: 7}
