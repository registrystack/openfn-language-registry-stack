      - list
      - revisions
      - create
      - patch
      readableFields:
      - local-identifier
      - name
      rowBoundaries: unrestricted
      writableFields:
      - local-identifier
      - name
      recordType: organization
    - operations:
      - get
      - list
      - revisions
      - create
      - patch
      readableFields:
      - local-identifier
      - name
      rowBoundaries: unrestricted
      writableFields:
      - local-identifier
      - name
      recordType: informal-group
    - operations:
      - get
      - list
      - revisions
      - create
      - patch
      readableFields:
      - holder-farm
      - holder-person
      - start-date
      - end-date
      rowBoundaries: unrestricted
      writableFields:
      - holder-farm
      - holder-person
      - start-date
      - end-date
      recordType: person-agricultural-holder-role
    - operations:
      - get
      - list
      - revisions
      - create
      - patch
      readableFields:
      - holder-farm
      - holder-organization
      - start-date
      - end-date
      rowBoundaries: unrestricted
      writableFields:
      - holder-farm
      - holder-organization
      - start-date
      - end-date
      recordType: organization-agricultural-holder-role
    - operations:
      - get
      - list
      - revisions
      - create
      - patch
      readableFields:
      - holder-farm
      - holder-group
      - start-date
      - end-date
      rowBoundaries: unrestricted
      writableFields:
      - holder-farm
      - holder-group
      - start-date
      - end-date
      recordType: group-agricultural-holder-role
    actions:
    - action: correct-farm-name
      operations:
      - start
      targets:
      - recordType: farm
        rowBoundaries: unrestricted
    proposals:
    - action: correct-farm-name
      operations:
      - get
      - edit
      - submit
      - revise
      - cancel
      readableInputs:
      - record
      - name
      - reason
      - supporting-reference
      ownership: caller
      targets:
      - recordType: farm
        rowBoundaries: unrestricted
  actorKind: human
  requesterClients:
  - editor
- id: reviewer
  default: false
  principalClaim: registry_principal
  requiredScopes:
  - starter:reviewer
  requiredPurposes:
  - starter-learning
  permissions:
    records:
    - operations:
      - get
      - list
      - revisions
      readableFields:
      - local-identifier
      - name
      rowBoundaries: unrestricted
      recordType: farm
    - operations:
      - get
      - list
      - revisions
      readableFields:
      - local-identifier
      - name
      rowBoundaries: unrestricted
      recordType: person
    - operations:
      - get
      - list
      - revisions
      readableFields:
      - local-identifier
      - name
      rowBoundaries: unrestricted
      recordType: organization
    - operations:
      - get
      - list
      - revisions
      readableFields:
      - local-identifier
      - name
      rowBoundaries: unrestricted
      recordType: informal-group
    - operations:
      - get
      - list
      - revisions
      readableFields:
      - holder-farm
      - holder-person
      - start-date
      - end-date
      rowBoundaries: unrestricted
      recordType: person-agricultural-holder-role
    - operations:
      - get
      - list
      - revisions
      readableFields:
      - holder-farm
      - holder-organization
      - start-date
      - end-date
      rowBoundaries: unrestricted
      recordType: organization-agricultural-holder-role
    - operations:
      - get
      - list
      - revisions
      readableFields:
      - holder-farm
      - holder-group
      - start-date
      - end-date
      rowBoundaries: unrestricted
      recordType: group-agricultural-holder-role
    proposals:
    - action: correct-farm-name
      operations:
      - get
      - get-review-context
      readableInputs:
      - record
      - name
      - reason
      - supporting-reference
      readableContextFields:
      - farmId
      - currentName
      - changes
      - reason
      - supportingReference
      targets:
