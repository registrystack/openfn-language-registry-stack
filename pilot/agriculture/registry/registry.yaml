# Registry project for the agricultural-holdings starter: the entities,
# access profiles, and catalogue description that `bregctl check`
# compiles into a running registry. Read MODEL.md alongside it for
# the reasoning behind these choices. canonicalBaseIri below is a
# reserved example.org name standing in for your registry's real
# identity; replace it before you build a production package.
apiVersion: id.registrystack.org/formats/breg/project/v1alpha1
kind: BRegProject
package:
  sourceRevision: agriculture-openfn-pilot-0.45.0
manifestProjection:
  accessProfile: editor
  classificationCeiling: restricted
  catalog:
    baseUrl: https://agricultural-holdings.example.org
    title: Agricultural holding register
    description: Maintain agricultural production units and separately asserted holder
      responsibilities.
    publisher:
      id: synthetic-custodian
      name: Synthetic example custodian
  publicService:
    id: directory-service
    title: Agricultural holding register
  datasets:
  - id: directory
    title: Agricultural holding register
    description: Maintain agricultural production units and separately asserted holder
      responsibilities.
    owner: Synthetic example custodian
    status: active
  dataServices:
  - id: directory-api
    title: Agricultural holding register
    endpointUrl: https://agricultural-holdings.example.org
    servesDatasets:
    - directory
  distributions: []
  entities:
  - id: farm
    title: Farm
    conceptUri: https://publicschema.org/agri/Farm
    identifiers:
    - field: local-identifier
      kind: local
    fields:
    - id: name
      concepts:
      - https://publicschema.org/name
  - id: person
    title: Person
    conceptUri: https://publicschema.org/Person
    identifiers:
    - field: local-identifier
      kind: local
    fields:
    - id: name
      concepts:
      - https://publicschema.org/name
  - id: organization
    title: Organization
    conceptUri: https://publicschema.org/Organization
    identifiers:
    - field: local-identifier
      kind: local
    fields:
    - id: name
      concepts:
      - https://publicschema.org/name
  - id: informal-group
    title: Informal Group
    conceptUri: https://publicschema.org/InformalGroup
    identifiers:
    - field: local-identifier
      kind: local
    fields:
    - id: name
      concepts:
      - https://publicschema.org/name
  - id: person-agricultural-holder-role
    title: Person Agricultural Holder Role
    conceptUri: https://publicschema.org/agri/PersonAgriculturalHolderRole
    identifiers: []
    fields:
    - id: holder-farm
      relationshipRole: holder-farm
      relationshipConceptUri: https://publicschema.org/agri/holder_farm
    - id: holder-person
      relationshipRole: holder-person
      relationshipConceptUri: https://publicschema.org/agri/holder_person
    - id: start-date
      concepts:
      - https://publicschema.org/start_date
    - id: end-date
      concepts:
      - https://publicschema.org/end_date
  - id: organization-agricultural-holder-role
    title: Organization Agricultural Holder Role
    conceptUri: https://publicschema.org/agri/OrganizationAgriculturalHolderRole
    identifiers: []
    fields:
    - id: holder-farm
      relationshipRole: holder-farm
      relationshipConceptUri: https://publicschema.org/agri/holder_farm
    - id: holder-organization
      relationshipRole: holder-organization
      relationshipConceptUri: https://publicschema.org/agri/holder_organization
    - id: start-date
      concepts:
      - https://publicschema.org/start_date
    - id: end-date
      concepts:
      - https://publicschema.org/end_date
  - id: group-agricultural-holder-role
    title: Group Agricultural Holder Role
    conceptUri: https://publicschema.org/agri/GroupAgriculturalHolderRole
    identifiers: []
    fields:
    - id: holder-farm
      relationshipRole: holder-farm
      relationshipConceptUri: https://publicschema.org/agri/holder_farm
    - id: holder-group
      relationshipRole: holder-group
      relationshipConceptUri: https://publicschema.org/agri/holder_group
    - id: start-date
      concepts:
      - https://publicschema.org/start_date
    - id: end-date
      concepts:
      - https://publicschema.org/end_date
accessProfiles:
- id: reader
  default: false
  principalClaim: registry_principal
  requiredScopes:
  - starter:reader
  requiredPurposes:
  - starter-learning
  permissions:
    records:
    - operations:
      - get
      - list
      readableFields:
      - local-identifier
      - name
      rowBoundaries: unrestricted
      recordType: farm
- id: editor
