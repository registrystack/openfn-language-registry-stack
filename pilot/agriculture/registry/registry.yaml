- id: openfn-service
  default: false
  principalClaim: registry_principal
  requiredScopes:
  - pilot:submit
  requiredPurposes:
  - agriculture-registration
  permissions:
    records:
    - operations:
      - get
      - create
      - lookup
      readableFields:
      - local-identifier
      - name
      rowBoundaries: unrestricted
      writableFields:
      - local-identifier
      - name
      lookups:
      - selector: by-local-identifier
        valueOrigin: request
      recordType: farm
    actions:
    - action: correct-farm-name
      operations:
      - start
      targets:
      - recordType: farm
        rowBoundaries: unrestricted
    proposals:
    - action: correct-farm-name
      operations:
      - get
      - edit
      - submit
      - revise
      - cancel
      readableInputs:
      - record
      - name
