project:
  id: agricultural-holdings
  canonicalBaseIri: https://agricultural-holdings.example.org
  version: 0.1.0
  defaultLanguage: en
datasets:
- id: directory
recordTypes:
- id: farm
  primaryDataset: directory
  route: farms
  mutationMode: mutable
  classification: restricted
  fields:
  - id: local-identifier
    type: string
    required: true
    classification: restricted
    apiName: localIdentifier
    minimumLength: 1
    maximumLength: 160
  - id: name
    type: string
    required: true
    classification: restricted
    minimumLength: 1
    maximumLength: 160
  constraints:
  - fields:
    - local-identifier
    type: unique
  selectorProfiles:
  - id: by-local-identifier
    fields:
    - local-identifier
  hooks:
  - id: farm-created-v1
    phase: after
    trigger: created
    projection:
    - local-identifier
    handler:
      destinationId: openfn
      type: url
  - id: farm-patched-v1
    phase: after
    trigger: patched
    projection:
    - local-identifier
    handler:
      destinationId: openfn
      type: url
  mutationPolicy:
    patch: proposal-required
- id: person
  primaryDataset: directory
  route: persons
  mutationMode: mutable
  classification: restricted
  fields:
  - id: local-identifier
    type: string
    required: true
    classification: restricted
    apiName: localIdentifier
    minimumLength: 1
    maximumLength: 160
  - id: name
    type: string
    required: true
    classification: restricted
    minimumLength: 1
    maximumLength: 160
  constraints:
  - fields:
    - local-identifier
    type: unique
- id: organization
  primaryDataset: directory
  route: organizations
  mutationMode: mutable
  classification: restricted
  fields:
  - id: local-identifier
    type: string
    required: true
    classification: restricted
    apiName: localIdentifier
    minimumLength: 1
    maximumLength: 160
  - id: name
    type: string
    required: true
    classification: restricted
    minimumLength: 1
    maximumLength: 160
  constraints:
  - fields:
    - local-identifier
    type: unique
- id: informal-group
  primaryDataset: directory
  route: informal-groups
  mutationMode: mutable
  classification: restricted
  fields:
  - id: local-identifier
    type: string
    required: true
    classification: restricted
    apiName: localIdentifier
    minimumLength: 1
    maximumLength: 160
  - id: name
    type: string
    required: true
    classification: restricted
    minimumLength: 1
    maximumLength: 160
  constraints:
  - fields:
    - local-identifier
    type: unique
- id: person-agricultural-holder-role
  primaryDataset: directory
  route: person-agricultural-holder-roles
  mutationMode: mutable
  classification: restricted
  fields:
  - id: holder-farm
    type: reference
    required: true
    classification: restricted
    target: farm
    apiName: holderFarm
  - id: holder-person
    type: reference
    required: true
    classification: restricted
    target: person
    apiName: holderPerson
  - id: start-date
    type: date
    required: false
    classification: restricted
    apiName: startDate
  - id: end-date
    type: date
    required: false
    classification: restricted
    apiName: endDate
  constraints:
  - left: start-date
    operator: less-than-or-equal
    right: end-date
    type: compare
- id: organization-agricultural-holder-role
  primaryDataset: directory
  route: organization-agricultural-holder-roles
  mutationMode: mutable
  classification: restricted
  fields:
  - id: holder-farm
    type: reference
    required: true
    classification: restricted
    target: farm
    apiName: holderFarm
  - id: holder-organization
    type: reference
    required: true
    classification: restricted
    target: organization
    apiName: holderOrganization
  - id: start-date
    type: date
    required: false
    classification: restricted
    apiName: startDate
  - id: end-date
    type: date
    required: false
    classification: restricted
    apiName: endDate
  constraints:
  - left: start-date
    operator: less-than-or-equal
    right: end-date
    type: compare
- id: group-agricultural-holder-role
  primaryDataset: directory
  route: group-agricultural-holder-roles
  mutationMode: mutable
  classification: restricted
  fields:
  - id: holder-farm
    type: reference
    required: true
    classification: restricted
    target: farm
    apiName: holderFarm
  - id: holder-group
    type: reference
    required: true
    classification: restricted
    target: informal-group
    apiName: holderGroup
  - id: start-date
    type: date
    required: false
    classification: restricted
    apiName: startDate
  - id: end-date
    type: date
    required: false
    classification: restricted
    apiName: endDate
  constraints:
  - left: start-date
    operator: less-than-or-equal
    right: end-date
    type: compare
reviewAuthorities:
- id: casework
  protocol: id.registrystack.org/protocols/review/v1
actions:
- id: correct-farm-name
  execution:
    mode: proposal
    proposal:
      review:
        type: required
        authority: casework
        source: agricultural-holdings
        policy:
          id: name-correction
      reviewContext:
        id: farm-name-context
        fields:
          farmId:
            type: input
            input: record
          currentName:
            type: record
            input: record
            field: name
          changes:
            type: changes
            recordType: farm
            fields:
            - name
          reason:
            type: input
            input: reason
          supportingReference:
            type: input
            input: supporting-reference
      application:
        mode: manual
      retention:
        mode: operator-erase
  commitGuards:
    targets:
    - input: record
      revision: unchanged
  inputs:
  - id: record
    type: reference
    target: farm
    required: true
    classification: restricted
  - id: name
    type: string
    required: true
    classification: restricted
    minimumLength: 1
    maximumLength: 160
  - id: reason
    type: string
    required: true
    classification: restricted
    minimumLength: 1
    maximumLength: 500
  - id: supporting-reference
    apiName: supportingReference
    type: string
    required: true
    classification: restricted
    minimumLength: 1
    maximumLength: 500
  plan:
    type: fixed
    effects:
    - id: farm-name
      target:
        fromInput: record
      operation: patch
      set:
        name:
          fromInput: name
